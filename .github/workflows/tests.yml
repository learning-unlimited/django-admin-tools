name: Tests

on:
  pull_request:
  push:
    branches:
      - master
      - esp

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            django-version: ">=4.0,<4.1"
          - python-version: "3.10"
            django-version: ">=4.1,<4.2"
          - python-version: "3.12"
            django-version: ">=4.2,<4.3"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "Django${{ matrix.django-version }}"

      - name: Run tests
        run: python -Wall test_proj/manage.py test
